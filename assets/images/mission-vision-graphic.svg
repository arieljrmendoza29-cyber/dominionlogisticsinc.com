<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Constellation of interconnected fleet operations converging on a central operational plane, representing the unified infrastructure future for logistics.">
  <defs>
    <pattern id="mvGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#D9DDE1"/>
    </pattern>
    <linearGradient id="mvArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2C4C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B4BCC4"/>
      <stop offset="100%" stop-color="#0F2C4C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect width="800" height="600" fill="url(#mvGrid)" opacity="0.5"/>

  <!-- Ambient concentric rings from center -->
  <g fill="none" opacity="0.35">
    <circle cx="400" cy="300" r="80" stroke="#B4BCC4" stroke-width="1"/>
    <circle cx="400" cy="300" r="150" stroke="#B4BCC4" stroke-width="1"/>
    <circle cx="400" cy="300" r="220" stroke="#B4BCC4" stroke-width="1" stroke-dasharray="2,4"/>
  </g>

  <!-- Interconnecting lines (satellite to satellite arcs) -->
  <g stroke="#B4BCC4" stroke-width="1" fill="none" opacity="0.6">
    <line x1="400" y1="120" x2="608" y2="230"/>
    <line x1="608" y1="230" x2="580" y2="440"/>
    <line x1="580" y1="440" x2="260" y2="470"/>
    <line x1="260" y1="470" x2="160" y2="250"/>
    <line x1="160" y1="250" x2="400" y2="120"/>
  </g>

  <!-- Hub-to-satellite lines (drawn on top of ambient) -->
  <g stroke="#0F2C4C" stroke-width="1.5" fill="none">
    <line x1="400" y1="300" x2="400" y2="150"/>
    <line x1="400" y1="300" x2="586" y2="240"/>
    <line x1="400" y1="300" x2="565" y2="425"/>
    <line x1="400" y1="300" x2="275" y2="460"/>
    <line x1="400" y1="300" x2="180" y2="260"/>
  </g>

  <!-- Data flow dots -->
  <g fill="#0F2C4C">
    <circle cx="400" cy="220" r="3"/>
    <circle cx="493" cy="270" r="3"/>
    <circle cx="482" cy="362" r="3"/>
    <circle cx="337" cy="380" r="3"/>
    <circle cx="290" cy="280" r="3"/>
  </g>

  <!-- Satellite nodes (5 pillars) -->
  <!-- Top: Dispatch -->
  <g>
    <rect x="360" y="112" width="80" height="72" rx="8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="376" y="128" width="48" height="4" rx="1" fill="#0F2C4C"/>
    <rect x="376" y="138" width="36" height="3" rx="1" fill="#B4BCC4"/>
    <rect x="376" y="146" width="42" height="3" rx="1" fill="#B4BCC4"/>
    <text x="400" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">DISPATCH</text>
  </g>

  <!-- Right upper: Fleet -->
  <g>
    <rect x="562" y="204" width="80" height="72" rx="8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <!-- truck icon -->
    <rect x="578" y="228" width="30" height="16" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="608" y="234" width="14" height="10" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <circle cx="586" cy="248" r="3" fill="none" stroke="#0F2C4C" stroke-width="1.2"/>
    <circle cx="614" cy="248" r="3" fill="none" stroke="#0F2C4C" stroke-width="1.2"/>
    <text x="602" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">FLEET</text>
  </g>

  <!-- Right lower: Data -->
  <g>
    <rect x="540" y="404" width="80" height="72" rx="8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <!-- chart icon -->
    <g stroke="#0F2C4C" stroke-width="1.5" fill="none" stroke-linecap="round">
      <line x1="558" y1="440" x2="558" y2="428"/>
      <line x1="568" y1="440" x2="568" y2="422"/>
      <line x1="578" y1="440" x2="578" y2="432"/>
      <line x1="588" y1="440" x2="588" y2="418"/>
      <line x1="598" y1="440" x2="598" y2="426"/>
    </g>
    <text x="580" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">DATA</text>
  </g>

  <!-- Left lower: Drivers -->
  <g>
    <rect x="220" y="440" width="80" height="72" rx="8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <circle cx="260" cy="460" r="6" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <path d="M 246 480 Q 260 468 274 480 L 274 486 L 246 486 Z" fill="none" stroke="#0F2C4C" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="260" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">DRIVERS</text>
  </g>

  <!-- Left upper: Systems -->
  <g>
    <rect x="140" y="224" width="80" height="72" rx="8" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="156" y="242" width="20" height="14" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="184" y="242" width="20" height="14" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="170" y="260" width="20" height="14" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <text x="180" y="288" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">SYSTEMS</text>
  </g>

  <!-- Central hub -->
  <g>
    <!-- Halo -->
    <circle cx="400" cy="300" r="82" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="400" cy="300" r="78" fill="none" stroke="#B4BCC4" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- Hub core -->
    <circle cx="400" cy="300" r="66" fill="#0F2C4C"/>

    <!-- Arc across hub — echoes the logo's arc -->
    <path d="M 354 282 Q 400 252 446 282" stroke="url(#mvArc)" stroke-width="2" fill="none" stroke-linecap="round"/>

    <text x="400" y="298" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#B4BCC4" letter-spacing="2">ONE</text>
    <text x="400" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">OPERATIONAL</text>
    <text x="400" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">PLANE</text>
  </g>

  <!-- Corner labels -->
  <text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#8891A0" letter-spacing="2">MISSION</text>
  <text x="40" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333F48">Eliminate bottlenecks</text>

  <text x="760" y="40" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#8891A0" letter-spacing="2">VISION</text>
  <text x="760" y="56" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#333F48">Unified infrastructure</text>

  <!-- Bottom hairline -->
  <line x1="40" y1="568" x2="760" y2="568" stroke="#E5E8EC" stroke-width="1"/>
  <circle cx="40" cy="568" r="3" fill="#0F2C4C"/>
  <circle cx="760" cy="568" r="3" fill="#0F2C4C"/>
</svg>
