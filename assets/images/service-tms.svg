<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="TMS integration hub diagram showing Transportation Management System connected to Dispatch, Routing, Fleet Health, Drivers, Billing, and Analytics subsystems.">
  <defs>
    <pattern id="tmsGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E5E8EC"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect width="800" height="600" fill="url(#tmsGrid)" opacity="0.6"/>

  <!-- Connecting lines (drawn first, behind nodes) -->
  <g stroke="#B4BCC4" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="400" y1="300" x2="400" y2="120"/>
    <line x1="400" y1="300" x2="620" y2="200"/>
    <line x1="400" y1="300" x2="620" y2="400"/>
    <line x1="400" y1="300" x2="400" y2="480"/>
    <line x1="400" y1="300" x2="180" y2="400"/>
    <line x1="400" y1="300" x2="180" y2="200"/>
  </g>

  <!-- Data flow dots on lines -->
  <g fill="#0F2C4C">
    <circle cx="400" cy="200" r="3"/>
    <circle cx="510" cy="250" r="3"/>
    <circle cx="510" cy="350" r="3"/>
    <circle cx="400" cy="400" r="3"/>
    <circle cx="290" cy="350" r="3"/>
    <circle cx="290" cy="250" r="3"/>
  </g>

  <!-- Central TMS hub -->
  <g>
    <circle cx="400" cy="300" r="80" fill="#0F2C4C"/>
    <circle cx="400" cy="300" r="80" fill="none" stroke="#B4BCC4" stroke-width="1" stroke-dasharray="2,4" opacity="0.5" transform="scale(1.15) translate(-52,-39)"/>
    <text x="400" y="288" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#B4BCC4" letter-spacing="2">CORE</text>
    <text x="400" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">TMS</text>
  </g>

  <!-- Satellite nodes -->
  <!-- Top: Dispatch -->
  <g>
    <circle cx="400" cy="90" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="388" y="76" width="24" height="16" rx="2" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <circle cx="394" cy="82" r="1.5" fill="#0F2C4C"/>
    <text x="400" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">DISPATCH</text>
  </g>

  <!-- Top-right: Analytics -->
  <g>
    <circle cx="660" cy="180" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <g stroke="#0F2C4C" stroke-width="1.5" fill="none" stroke-linecap="round">
      <line x1="648" y1="180" x2="648" y2="170"/>
      <line x1="656" y1="180" x2="656" y2="165"/>
      <line x1="664" y1="180" x2="664" y2="172"/>
      <line x1="672" y1="180" x2="672" y2="160"/>
    </g>
    <text x="660" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">ANALYTICS</text>
  </g>

  <!-- Bottom-right: Billing -->
  <g>
    <circle cx="660" cy="420" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <rect x="648" y="410" width="24" height="14" rx="1" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <line x1="648" y1="415" x2="672" y2="415" stroke="#0F2C4C" stroke-width="1"/>
    <text x="660" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">BILLING</text>
  </g>

  <!-- Bottom: Drivers -->
  <g>
    <circle cx="400" cy="510" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <circle cx="400" cy="497" r="4" fill="none" stroke="#0F2C4C" stroke-width="1.5"/>
    <path d="M 390 512 Q 400 505 410 512 L 410 518 L 390 518 Z" fill="none" stroke="#0F2C4C" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="400" y="536" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">DRIVERS</text>
  </g>

  <!-- Bottom-left: Fleet Health -->
  <g>
    <circle cx="140" cy="420" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <path d="M 132 420 L 138 420 L 141 412 L 145 428 L 148 420 L 154 420" fill="none" stroke="#0F2C4C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="140" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">FLEET HEALTH</text>
  </g>

  <!-- Top-left: Routing -->
  <g>
    <circle cx="140" cy="180" r="42" fill="#FFFFFF" stroke="#0F2C4C" stroke-width="1.5"/>
    <path d="M 128 185 Q 135 170 145 180 T 155 175" fill="none" stroke="#0F2C4C" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="128" cy="185" r="2" fill="#0F2C4C"/>
    <circle cx="155" cy="175" r="2" fill="#0F2C4C"/>
    <text x="140" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#0F2C4C">ROUTING</text>
  </g>

  <!-- Corner labels -->
  <text x="40" y="40" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#8891A0" letter-spacing="2">INTEGRATION MAP</text>
  <text x="760" y="40" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" fill="#8891A0" letter-spacing="2">6 SYSTEMS · 1 PLANE</text>

  <!-- Bottom hairline route motif -->
  <line x1="40" y1="570" x2="760" y2="570" stroke="#E5E8EC" stroke-width="1"/>
  <circle cx="40" cy="570" r="3" fill="#0F2C4C"/>
  <circle cx="760" cy="570" r="3" fill="#0F2C4C"/>
</svg>
